name: Build and publish ApexPulse
# A workflow-file push after source promotion builds and publishes private ApexPulse main.
# Build and publish the promoted ApexPulse 1.5.0 app update.
# Scheduled checks remain as a fallback; feature test builds are non-publishing.
# Exercise receiver shutdown-state handling on the next hosted feature verification.
# Final validation includes the Home screen live-versus-silent status treatment.
# Verify the extracted StatsScreen source and the updated feature-branch tree.
# Verify ExploreScreen extraction and shared artwork visibility.
# Verify saved navigation state and the complete screen extraction pass.
# Verify HomeScreen extraction and reusable driver-hub components.
# Rebuild after correcting the HomeScreen commit target to the 1.4 feature branch.
# Verify the dedicated Race Centre source and its device-discovery components.
# Verify dedicated Driver and Cockpit screens plus shared UI components.
# Re-run after adding the shared typography import required by UiComponents.
# Verify the source-aware MFD pages and the complete screen architecture.
# Run the new MFD projection regression tests after extracting the pure data projection.
# Re-run MFD unit tests using the repository's existing JUnit test API.
# Verify streamed session analytics and Stats archive metrics.
# Verify F1 2026 session/lap/status/damage decoding, packet assembly and expanded MFD.
# Verify session-history best-lap handling, valid-lap filtering and its CSV/MFD integration.
# Verify the disconnected Cockpit MFD zero-value preview on the 1.4 feature branch.
# Recheck Home preview navigation after exposing the offline cockpit entry point.
# Build and test the production-promotion branch without publishing on push.
# Re-run after removing a duplicate best-lap test-fixture declaration.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apexpulse.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private ApexPulse source branch or tag to build
        required: true
        default: main
        type: string
      publish_release:
        description: Publish this verified build to the in-app update channel
        required: true
        default: false
        type: boolean
      release_notes:
        description: Release notes (used only when publishing)
        required: false
        default: "ApexPulse update"
        type: string

permissions:
  contents: write

concurrency:
  group: apexpulse-release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check one-time setup
        id: preflight
        env:
          SOURCE_TOKEN: ${{ secrets.APEXPULSE_SOURCE_TOKEN }}
          SIGNING_KEYSTORE_B64: ${{ secrets.APEXPULSE_SIGNING_KEYSTORE_B64 }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_TOKEN" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              echo "Scheduled check skipped: configure APEXPULSE_SOURCE_TOKEN first."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Configure APEXPULSE_SOURCE_TOKEN as documented in BUILD-SETUP.md."
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == "true" && "$SOURCE_REF" != "main" ]]; then
            echo "::error::Feature branches cannot publish releases. Promote reviewed source to main first."
            exit 1
          fi
          USE_PRODUCTION_SIGNING=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$SOURCE_REF" == "main" || "$PUBLISH_RELEASE" == "true" ]]; then
            if [[ -z "$SIGNING_KEYSTORE_B64" ]]; then
              if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
                echo "Scheduled check skipped: configure APEXPULSE_SIGNING_KEYSTORE_B64 before automatic publishing."
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Configure APEXPULSE_SIGNING_KEYSTORE_B64 before building main or publishing a release."
              exit 1
            fi
            USE_PRODUCTION_SIGNING=true
          fi
          echo "use_production_signing=$USE_PRODUCTION_SIGNING" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout private ApexPulse source
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: imposedentertainment-art/ApexPulse
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.APEXPULSE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Validate source shell scripts
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        working-directory: source
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            [[ -f "$script" ]] || continue
            bash -n "$script"
            echo "Shell syntax OK: $script"
          done

      - name: Check whether a build is due
        id: gate
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        working-directory: source
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled checks build only when source main has a newer version
          # than the public update manifest.
          SOURCE_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -n 1)"
          SOURCE_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"$/\1/p' app/build.gradle.kts | head -n 1)"
          CURRENT_CODE="$(jq -r '.versionCode // 0' "$GITHUB_WORKSPACE/latest.json")"
          CURRENT_VERSION="$(jq -r '.version // "0.0.0"' "$GITHUB_WORKSPACE/latest.json")"
          SORTED_VERSION="$(printf '%s\n' "$CURRENT_VERSION" "$SOURCE_VERSION" | sort -V | tail -n 1)"
          if [[ -n "$SOURCE_CODE" && -n "$SOURCE_VERSION" && "$SOURCE_VERSION" != "$CURRENT_VERSION" && "$SORTED_VERSION" == "$SOURCE_VERSION" ]] && (( SOURCE_CODE > CURRENT_CODE )); then
            echo "New source release detected: $SOURCE_VERSION ($SOURCE_CODE)."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No newer version is ready. Current published release: $CURRENT_VERSION ($CURRENT_CODE)."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      - name: Install Android SDK components
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.1.0"

      - name: Restore the established ApexPulse signing identity
        if: ${{ steps.gate.outputs.should_build == 'true' && steps.preflight.outputs.use_production_signing == 'true' }}
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.APEXPULSE_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          CERT_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA1: *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="A70ADF61BB307148D1E064DEE91B7723D0654951"
          [[ "$CERT_SHA1" == "$EXPECTED" ]] || { echo "::error::Signing keystore does not match the installed ApexPulse certificate. Refusing to build."; exit 1; }
          echo "Verified the established ApexPulse signing certificate."
          echo "APEXPULSE_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests and build APK
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        id: build
        working-directory: source
        env:
          USE_PRODUCTION_SIGNING: ${{ steps.preflight.outputs.use_production_signing }}
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest
          if [[ "$USE_PRODUCTION_SIGNING" == "true" ]]; then
            gradle --no-daemon --max-workers=2 :app:assembleRelease
            echo "apk_relative=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            gradle --no-daemon --max-workers=2 :app:assembleDebug
            echo "apk_relative=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify APK, package, version and signing identity
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        id: verify
        working-directory: source
        env:
          EXPECT_PRODUCTION_CERT: ${{ steps.preflight.outputs.use_production_signing }}
          APK_RELATIVE: ${{ steps.build.outputs.apk_relative }}
        run: |
          set -euo pipefail
          APK="$PWD/$APK_RELATIVE"
          [[ -s "$APK" ]] || { echo "::error::Gradle did not produce the APK."; exit 1; }
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -v 4 "$APK"
          CERT_INFO="$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK")"
          CERT_SHA1="$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*certificate SHA-1 digest: *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$EXPECT_PRODUCTION_CERT" == "true" ]]; then
            [[ "$CERT_SHA1" == "A70ADF61BB307148D1E064DEE91B7723D0654951" ]] || { echo "::error::APK signing certificate mismatch."; exit 1; }
            echo "Verified established ApexPulse signing identity."
          else
            echo "Verified signed feature-branch test APK. It uses a temporary debug identity and cannot update an installed production build."
          fi
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"$/\1/p' app/build.gradle.kts | head -n 1)"
          [[ -n "$VERSION_CODE" && -n "$VERSION_NAME" ]] || { echo "::error::Could not read version metadata."; exit 1; }
          BADGING="$("$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging "$APK")"
          grep -F "package: name='com.apexpulse.app' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING" >/dev/null
          MIN_SDK="$(printf '%s\n' "$BADGING" | grep -oE "minSdkVersion:'[0-9]+'" | head -n 1 | cut -d"'" -f2 || true)"
          TARGET_SDK="$(printf '%s\n' "$BADGING" | grep -oE "targetSdkVersion:'[0-9]+'" | head -n 1 | cut -d"'" -f2 || true)"
          [[ "$MIN_SDK" == "26" ]] || { echo "::error::Unexpected minSdk '$MIN_SDK'; expected 26."; printf '%s\n' "$BADGING"; exit 1; }
          [[ "$TARGET_SDK" == "36" ]] || { echo "::error::Unexpected targetSdk '$TARGET_SDK'; expected 36 until Android 17 LAN permission handling is implemented."; printf '%s\n' "$BADGING"; exit 1; }
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "APK verified: $VERSION_NAME ($VERSION_CODE), SHA-256 $SHA256"

      - name: Upload test build artifact
        if: ${{ steps.gate.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: ApexPulse-${{ steps.verify.outputs.version }}-${{ steps.verify.outputs.version_code }}
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed APK release
        if: ${{ steps.gate.outputs.should_build == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
          APK_PATH: ${{ steps.verify.outputs.apk }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        run: |
          set -euo pipefail
          RELEASE_NOTES="${RELEASE_NOTES:-ApexPulse $VERSION: unified F1 device identity, telemetry receiver recovery, MFD improvements, Settings and Permissions Manager, background reliability controls, and automatic update notifications.}"
          [[ "$SOURCE_REF" == "main" ]] || { echo "::error::Publishing is only allowed from the private source repository's main branch."; exit 1; }
          CURRENT_CODE="$(jq -r '.versionCode // 0' latest.json)"
          CURRENT_VERSION="$(jq -r '.version // "0.0.0"' latest.json)"
          SORTED_VERSION="$(printf '%s\n' "$CURRENT_VERSION" "$VERSION" | sort -V | tail -n 1)"
          if (( VERSION_CODE <= CURRENT_CODE )) || [[ "$VERSION" == "$CURRENT_VERSION" || "$SORTED_VERSION" != "$VERSION" ]]; then
            echo "::error::Refusing to publish a non-newer or inconsistent version. Current: $CURRENT_VERSION ($CURRENT_CODE); candidate: $VERSION ($VERSION_CODE)."
            exit 1
          fi
          TAG="v$VERSION"
          ASSET="ApexPulse-$VERSION.apk"
          NAMED_APK="$RUNNER_TEMP/$ASSET"
          cp "$APK_PATH" "$NAMED_APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAMED_APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$NAMED_APK" --repo "$GITHUB_REPOSITORY" --title "ApexPulse $VERSION" --notes "$RELEASE_NOTES"
          fi
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          REMOTE_APK="$(mktemp)"
          trap 'rm -f "$REMOTE_APK"' EXIT
          curl --fail --location --retry 3 --retry-delay 2 --output "$REMOTE_APK" "$DOWNLOAD_URL"
          REMOTE_SHA256="$(sha256sum "$REMOTE_APK" | awk '{print $1}')"
          [[ "$REMOTE_SHA256" == "$APK_SHA256" ]] || { echo "::error::Downloaded release asset checksum does not match the verified build. latest.json will not be updated."; exit 1; }
          echo "Independently downloaded release asset and verified SHA-256."
          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg minimumVersion "1.2.1" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg releaseNotes "$RELEASE_NOTES" \
            '{version:$version,versionCode:$versionCode,minimumVersion:$minimumVersion,downloadUrl:$downloadUrl,sha256:$sha256,releaseNotes:$releaseNotes}' > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish ApexPulse $VERSION update manifest"
          git push origin HEAD:main
          echo "Published $TAG and updated latest.json. Installed apps can now check for this update."
