name: Verify ApexPulse UI overhaul
# Non-publishing feature-branch build; never updates latest.json or a release tag.
# Re-run this workflow after every source-branch UI or reliability change.
# Includes latest UI truthfulness fixes and cellular update-routing changes (Nov 27).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-apexpulse-ui.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private ApexPulse source branch to verify
        required: true
        default: feature/apexpulse-ui-overhaul
        type: string

permissions:
  contents: read

concurrency:
  group: apexpulse-ui-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7

      - name: Checkout private ApexPulse source
        uses: actions/checkout@v7
        with:
          repository: imposedentertainment-art/ApexPulse
          ref: ${{ inputs.source_ref || 'feature/apexpulse-ui-overhaul' }}
          token: ${{ secrets.APEXPULSE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Validate shell scripts
        working-directory: source
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            [[ -f "$script" ]] || continue
            bash -n "$script"
          done

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.1.0"

      - name: Run unit tests and assemble APK
        working-directory: source
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK metadata and alignment
        working-directory: source
        run: |
          set -euo pipefail
          APK="$PWD/app/build/outputs/apk/debug/app-debug.apk"
          [[ -s "$APK" ]]
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -v 4 "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging "$APK")"
          grep -F "package: name='com.apexpulse.app'" <<< "$BADGING"
          echo "Feature verification APK is not production-signed and cannot update an installed production build."

      - name: Upload verification APK
        uses: actions/upload-artifact@v5
        with:
          name: ApexPulse-UI-overhaul-verification
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
